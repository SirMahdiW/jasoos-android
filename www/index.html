body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;min-height:100vh;display:flex;justify-content:center;line-height:1.7;overscroll-behavior:none}

.cl{background:var(--card);border-radius:30px;box-shadow:9px 9px 20px rgba(0,0,0,.65),-6px -6px 14px rgba(255,255,255,.04),inset 3px 3px 6px rgba(255,255,255,.1),inset -5px -5px 10px rgba(0,0,0,.35)}
.in{background:var(--in);border-radius:22px;box-shadow:inset 4px 4px 9px rgba(0,0,0,.65),inset -3px -3px 7px rgba(255,255,255,.04)}

.blk{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;flex:none;color:var(--ink);box-shadow:inset 3px 3px 5px rgba(255,255,255,.45),inset -3px -3px 6px rgba(0,0,0,.22),4px 4px 9px rgba(0,0,0,.5)}

.brand{display:flex;align-items:center;gap:14px}
.brand .blk{width:58px;height:58px;border-radius:20px}
.brand h1{margin:0;font-size:30px;font-weight:900;line-height:1.2}
.brand p{margin:0;color:var(--mut);font-size:13px}
.lab{color:var(--mut);font-size:13px;font-weight:700;margin:6px 6px -4px}
.card{padding:6px 16px}
.row{display:flex;align-items:center;gap:12px;padding:13px 0}

.row .t b{display:block;font-size:16px;font-weight:900}

.sw.on::after{inset-inline-start:33px;background:var(--g)}

.sp{flex:1}

.btn.v{color:#fff}

.bar i{display:block;height:100%;border-radius:4px;background:var(--y);transition:width .3s}
.stage{text-align:center;padding:30px 20px;margin-top:10px}
.disc{width:130px;height:130px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;color:var(--v)}
.disc.sm{width:92px;height:92px;margin-bottom:6px}

.box{padding:16px 10px;font-size:38px;font-weight:900;line-height:1.3;min-height:84px;display:grid;place-items:center}
.dial{position:relative;width:260px;height:260px;margin:12px auto 6px;border-radius:50%}
.dial svg{position:absolute;inset:8px;width:calc(100% - 16px);height:calc(100% - 16px);transform:rotate(-90deg)}
.dial .tm{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.dial b{font-size:56px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.dial small{color:var(--mut);font-size:12px}
.st{text-align:center;font-weight:900;margin:6px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

.stats b{display:block;font-size:28px;font-weight:900;line-height:1.2}.stats small{font-size:12px;font-weight:700}
.li{display:flex;align-items:center;gap:12px;padding:10px 14px;margin-bottom:10px;border-radius:22px}
.li .t{flex:1;line-height:1.3}.li small{color:var(--mut);font-size:12px}
.tag{padding:3px 12px;border-radius:12px;font-weight:900;font-size:13px;color:var(--ink)}
.md{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.md>div{width:100%;max-width:480px;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));border-radius:34px 34px 0 0;line-height:1.9;animation:in .25s both}
.md h3{margin:0 0 6px;font-size:22px;font-weight:900}.md p{color:var(--mut);margin:0 0 6px}

A.innerHTML=`<div class="brand"><span class="blk y">${ic('search',30)}</span><div><h1>جاسوس</h1><p>بازی دورهمی · یک گوشی بین همه</p></div></div>
<div class="lab">تنظیمات بازی</div>
<div class="card cl">${row('c','users','بازیکنان','حداقل ۳ نفر',stp('n',S.n))}${row('p','search','جاسوس‌ها','بدون سقف ثابت',stp('s',S.s))}${row('y','clock','زمان بازی','از ۱ دقیقه، بدون سقف',stp('m',S.m,'دقیقه'))}</div>
<div class="lab">نقش‌های ویژه</div>
<div class="card cl">${rrow('sh','g','star','کلانتر','یار شهروندان')}${rrow('jk','v','smile','جوکر','همراه جاسوسان')}</div>
<div class="note in">${fa(S.n)} بازیکن: <b>${fa(sp)}</b> جاسوس${ex?` و <b>${fa(ex)}</b> نقش ویژه`:''} و <b>${fa(ci)}</b> شهروند</div>
<div class="sp"></div><button class="btn g" onclick="start()">${ic('play',20)} شروع بازی</button>`}
function start(){w=word();const ids=[...Array(S.n).keys()];for(let k=ids.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[ids[k],ids[j]]=[ids[j],ids[k]]}
R=Array(S.n).fill('cit');let p=0;for(let k=0;k<S.s;k++)R[ids[p++]]='spy';if(S.sh)R[ids[p++]]='sh';if(S.jk)R[ids[p++]]='jk';i=0;ready()}
function ready(){view='ready';A.innerHTML=`<div class="ph"><div class="meta"><span>پاس دادن گوشی</span><b>${fa(i+1)} از ${fa(S.n)}</b></div><div class="bar in"><i style="width:${(i+1)/S.n*100}%"></i></div></div>
<div class="stage cl"><div class="disc in">${ic('lock',56)}</div><span class="pill c">نوبت بازیکن ${fa(i+1)}</span><h2>گوشی را به این بازیکن بده</h2><p>فقط خودش دکمه را بزند و نقشش را ببیند؛ بقیه به صفحه نگاه نکنند.</p></div>
<div class="sp"></div><button class="btn v" onclick="showRole()">${ic('eye',21)} نمایش نقش</button>`}
const T={cit:['شهروند','از تیم شهروندان'],sh:['کلانتر','از تیم شهروندان'],jk:['جوکر','از تیم جاسوسان'],spy:['جاسوس','کلمه را نمی‌دانی']};
function showRole(){view='role';const r=R[i];A.innerHTML=`<div class="stage cl"><div class="disc sm in">${ic('eye',40)}</div><div class="k">نقش بازیکن ${fa(i+1)}</div><div class="box in">${T[r][0]}</div><div class="k">کلمه مخفی</div><div class="box in">${r==='spy'?'؟؟؟':w}</div><p style="margin-top:14px">${T[r][1]}</p></div>
<div class="sp"></div><button class="btn p" onclick="nextP()">${ic('eyeoff',21)} فهمیدم، مخفی کن</button>`}
function nextP(){i++;i<S.n?ready():game()}
const C=2*Math.PI*104;
function game(){view='game';let total=S.m*60,left=total,run=true,end=Date.now()+left*1000;
A.innerHTML=`<div class="dial cl"><svg viewBox="0 0 240 240"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd23f"/><stop offset="1" stop-color="#ff5d8f"/></linearGradient></defs><circle cx="120" cy="120" r="104" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="16"/><circle id="rg" cx="120" cy="120" r="104" fill="none" stroke="url(#g)" stroke-width="16" stroke-linecap="round" stroke-dasharray="${C}"/></svg><div class="tm"><b id="tt"></b><small>دقیقه : ثانیه</small></div></div>
<div class="st" id="st">زمان در جریان است</div><p style="text-align:center;color:var(--mut);margin:0">گوشی را وسط بگذارید و با هم گفت‌وگو کنید.</p><div class="sp"></div>
<button class="btn c" id="pb">${ic('pause',20)} توقف زمان</button><button class="btn p" onclick="fin()">پایان و نمایش نقش‌ها ${ic('next',20)}</button>`;
const pd=n=>fa(String(n).padStart(2,'0'));
function paint(){$('#tt').textContent=pd(Math.floor(left/60))+':'+pd(left%60);$('#rg').style.strokeDashoffset=C*(1-left/total)}
paint();clearInterval(tm);tm=setInterval(()=>{if(!run)return;left=Math.max(0,Math.ceil((end-Date.now())/1000));paint();if(left<=0){clearInterval(tm);$('#st').textContent='زمان تمام شد!';$('#st').style.color='var(--p)';try{navigator.vibrate&&navigator.vibrate([400,200,400])}catch(e){}}},250);
$('#pb').onclick=function(){run=!run;if(run)end=Date.now()+left*1000;this.innerHTML=(run?ic('pause',20)+' توقف زمان':ic('play',20)+' ادامه زمان');$('#st').textContent=run?'زمان در جریان است':'زمان متوقف شد'}}
function fin(){view='end';clearInterval(tm);const sp=R.filter(r=>r==='spy'||r==='jk').length;
const L=R.map((r,k)=>{const s=r==='spy'||r==='jk';return `<div class="li cl"><span class="blk ${s?'p':'g'}" style="width:40px;height:40px;border-radius:14px;font-weight:900">${fa(k+1)}</span><span class="t"><b>بازیکن ${fa(k+1)}</b><br><small>${s?'تیم جاسوسان':'تیم شهروندان'}</small></span><span class="tag ${s?'p':'g'}">${T[r][0]}</span></div>`}).join('');
A.innerHTML=`<div class="stage cl" style="margin-top:0;padding:20px"><div class="k" style="margin-top:0">کلمه این دور</div><div class="box in" style="color:var(--y)">${w}</div></div>
<div class="stats"><div class="c"><b>${fa(R.length)}</b><small>بازیکن</small></div><div class="p"><b>${fa(sp)}</b><small>تیم جاسوسان</small></div><div class="g"><b>${fa(R.length-sp)}</b><small>تیم شهروندان</small></div></div>
<div class="lab">نقش همه بازیکنان</div>${L}<button class="btn g" onclick="start()">${ic('redo',20)} دور جدید با همین تنظیمات</button><button class="btn y" onclick="setup()">بازگشت به تنظیمات</button>`}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&view==='role')ready()});
setup();
</script>
</body>
</html>
